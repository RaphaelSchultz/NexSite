<head><script>(function(){var f=HTMLElement.prototype.focus;HTMLElement.prototype.focus=function(o){return f.call(this,Object.assign({},o||{},{preventScroll:true}))};Element.prototype.scrollIntoView=function(){var e=this.parentElement;while(e&&e!==document.body){var cs=getComputedStyle(e);if(/(auto|scroll)/.test(cs.overflowY)&&e.scrollHeight>e.clientHeight){var r=this.getBoundingClientRect(),q=e.getBoundingClientRect();e.scrollBy({top:r.top-q.top-q.height*.3,behavior:"smooth"});return}if(/(auto|scroll)/.test(cs.overflowX)&&e.scrollWidth>e.clientWidth){var r2=this.getBoundingClientRect(),q2=e.getBoundingClientRect();e.scrollBy({left:r2.left-q2.left-8,behavior:"smooth"});return}e=e.parentElement}var r3=this.getBoundingClientRect();window.scrollBy({top:r3.top-innerHeight*.3,behavior:"smooth"})};window.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a)return;var h=a.getAttribute("href");if(h.charAt(0)==="#"){if(!e.defaultPrevented){e.preventDefault();if(h.length>1)location.hash=h}}else{e.preventDefault();if(/^https?:/.test(h))window.open(h,"_blank","noopener")}})})()</script><style>.toast:not(.show){opacity:0!important;visibility:hidden!important}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F2F3F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nex Notas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --surface-2:#F1F2F7; --surface-3:#E6E8F0; --glass:rgba(255,255,255,.72);
  --line:rgba(10,10,10,.08); --line-2:rgba(10,10,10,.14); --sep:rgba(60,60,67,.14);
  --ink:#0B1233; --ink-2:#3C4260; --ink-3:#6B6B73; --ink-4:#A1A1A8;
  --accent:#4F56F6; --accent-ink:#3A40D8; --accent-soft:#ECEDFF;
  --good:#15803D; --good-soft:#E8F8EE; --warn:#B45309; --warn-soft:#FFF7E6; --bad:#DC2626; --bad-soft:#FDECEC;
  --c2:#2563EB; --c3:#0D9488; --c4:#9333EA; --c5:#CA8A04;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --num:"Space Grotesk",-apple-system,system-ui,sans-serif;
  --serif:"Instrument Serif",Georgia,serif;
  --spring:cubic-bezier(.32,1.4,.42,1); --ease:cubic-bezier(.22,.8,.2,1);
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
[data-theme="dark"]{
  --bg:#04060F; --surface:#0E1330; --surface-2:#151B3D; --surface-3:#232B55; --glass:rgba(14,19,48,.72);
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14); --sep:rgba(84,84,88,.45);
  --ink:#EEF0FF; --ink-2:#C9CCE6; --ink-3:#98989F; --ink-4:#636366;
  --accent-ink:#A5A9FF; --accent-soft:rgba(79,86,246,.22);
  --good:#30D158; --good-soft:rgba(48,209,88,.14); --warn:#FFD60A; --warn-soft:rgba(255,214,10,.12); --bad:#FF453A; --bad-soft:rgba(255,69,58,.14);
  --c2:#0A84FF; --c3:#40C8B8; --c4:#BF5AF2; --c5:#D4A20B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block;flex-shrink:0}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.serif{font-family:var(--serif);font-style:italic;font-weight:400}
.still *,.still *::before,.still *::after{transition:none!important;animation:none!important}

/* ============ STACK / SCREENS ============ */
#stack{position:fixed;inset:0;overflow:hidden}
.scr{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;will-change:transform}
.scr.push-in{animation:pushIn .42s var(--ease) both}
.scr.push-out{animation:pushOut .42s var(--ease) both}
.scr.pop-in{animation:popIn .42s var(--ease) both}
.scr.pop-out{animation:popOut .38s var(--ease) both;z-index:2}
.scr.fade-in{animation:fadeIn .22s ease both}
@keyframes pushIn{from{transform:translateX(100%);box-shadow:-20px 0 40px rgba(0,0,0,.12)}to{transform:none}}
@keyframes pushOut{to{transform:translateX(-28%);filter:brightness(.92)}}
@keyframes popIn{from{transform:translateX(-28%);filter:brightness(.92)}to{transform:none}}
@keyframes popOut{to{transform:translateX(100%)}}
@keyframes fadeIn{from{opacity:.4;transform:scale(.995)}to{opacity:1;transform:none}}
.nav{position:absolute;top:0;left:0;right:0;z-index:5;height:calc(52px + var(--sat));padding:var(--sat) 8px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;transition:background .2s,border-color .2s;border-bottom:.5px solid transparent}
.nav.solid{background:var(--glass);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-bottom-color:var(--sep)}
.nav .nt{font-weight:600;font-size:16px;opacity:0;transform:translateY(4px);transition:all .2s;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.nav.solid .nt,.nav.always .nt{opacity:1;transform:none}
.nav .l{justify-self:start;display:flex;align-items:center}
.nav .r{justify-self:end;display:flex;gap:4px;align-items:center}
.back{display:flex;align-items:center;gap:2px;color:var(--accent-ink);font-size:16px;padding:8px 6px;margin-left:-2px;white-space:nowrap;max-width:110px;overflow:hidden}.back span{overflow:hidden;text-overflow:ellipsis}
.nbtn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative;transition:transform .2s var(--spring),background .15s}
.nbtn:active{transform:scale(.86);background:var(--surface-3)}
.nbtn .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:1.5px solid var(--bg)}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#818CF8,#4F56F6);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(52px + var(--sat)) 16px calc(112px + var(--sab));scrollbar-width:none;overscroll-behavior-y:contain}
.scroll::-webkit-scrollbar{display:none}
.lt{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:2px 4px 2px;line-height:1.12;transform-origin:left center;transition:opacity .15s}
.sub{margin:0 4px 12px;color:var(--ink-3);font-size:14px}
.row-chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px;scrollbar-width:none}
.row-chips::-webkit-scrollbar{display:none}
.chipb{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:17px;background:var(--surface);border:.5px solid var(--line-2);font-size:14px;font-weight:500;transition:transform .2s var(--spring)}
.chipb:active{transform:scale(.94)}
.chipb.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.chipb .cnt{background:var(--ink);color:var(--bg);border-radius:9px;font-size:11px;padding:0 6px;line-height:17px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 8px}
.sec h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em}
.sec a,.sec button{color:var(--accent-ink);font-size:15px}
.cap{margin:6px 16px 0;font-size:12px;color:var(--ink-3)}

/* ============ CARDS ============ */
.hero{border-radius:22px;padding:16px 18px 14px;background:linear-gradient(160deg,#1A1F55,#0B0F2A);color:#fff;position:relative;overflow:hidden}
[data-theme="dark"] .hero{background:linear-gradient(160deg,#20266A,#0E1330);border:.5px solid rgba(109,115,250,.4)}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,rgba(109,115,250,.65),transparent);filter:blur(10px)}
.hero>*{position:relative;z-index:1}
.hero .k{font-size:13px;color:rgba(255,255,255,.65);display:flex;justify-content:space-between;align-items:center}
.hero .v{font-size:38px;font-weight:600;margin-top:4px;line-height:1.05}
.hero .d{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:rgba(255,255,255,.7)}
.pos{color:#4ADE80;font-weight:600}.neg{color:#FCA5A5;font-weight:600}
.hero svg.sp{width:100%;height:40px;margin-top:8px}
.hero .ft{display:flex;gap:14px;font-size:11px;color:rgba(255,255,255,.55);margin-top:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.t{background:var(--surface);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;transition:transform .25s var(--spring);position:relative}
.t:active{transform:scale(.96)}
.t .k{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.t .k i{width:8px;height:8px;border-radius:3px}
.t .v{font-size:21px;font-weight:600;margin-top:4px}
.t .s{font-size:11px;color:var(--ink-3)}
.t .s b{font-weight:600}
.up{color:var(--good)} .dn{color:var(--bad)}
.card{background:var(--surface);border-radius:20px;padding:16px}
.meta-c{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;margin-top:10px}
.ring{width:62px;height:62px;position:relative}
.ring svg{width:62px;height:62px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:15px;font-weight:600}
.meta-c .x b{display:block;font-size:15px;font-weight:600}
.meta-c .x small{color:var(--ink-3);font-size:12px;display:block;margin-top:2px}
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width 1s var(--ease)}
.chev{color:var(--ink-4)}

/* ============ LISTS (iOS inset grouped) ============ */
.list{background:var(--surface);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 14px;position:relative;transition:background .12s}
.li:active{background:var(--surface-3)}
.li+.li::before{content:"";position:absolute;top:0;right:0;left:var(--inset,14px);border-top:.5px solid var(--sep)}
.li.ic{--inset:58px}
.li .ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .e{text-align:right;flex-shrink:0}
.li .e b{display:block;font-family:var(--num);font-weight:600;font-size:15px}
.li .e small{display:block;font-size:12px}
.li .val{color:var(--ink-3);font-size:15px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:10px;padding:2px 8px}
.pill.g{color:var(--good);background:var(--good-soft)}.pill.b{color:var(--bad);background:var(--bad-soft)}.pill.w{color:var(--warn);background:var(--warn-soft)}.pill.a{color:var(--accent-ink);background:var(--accent-soft)}.pill.m{color:var(--ink-3);background:var(--surface-2)}
/* iOS switch */
.sw{width:51px;height:31px;border-radius:16px;background:var(--surface-3);position:relative;flex-shrink:0;transition:background .25s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .3s var(--spring)}
.sw[aria-checked="true"]{background:#34C759}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
/* segmented */
.seg{display:flex;background:var(--surface-3);border-radius:10px;padding:2px;position:relative}
.seg button{flex:1;height:30px;border-radius:8px;font-size:13px;font-weight:500;position:relative;z-index:1;transition:color .2s}
.seg .knob{position:absolute;top:2px;bottom:2px;left:2px;border-radius:8px;background:var(--surface);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);transition:transform .35s var(--spring),width .3s}
[data-theme="dark"] .seg .knob{background:#636366}
.srch{display:flex;align-items:center;gap:6px;height:38px;border-radius:11px;background:var(--surface-3);padding:0 10px;color:var(--ink-3);margin:0 0 12px}
.srch input{flex:1;border:0;background:none;outline:0;font-size:16px;color:var(--ink)}
/* hbars */
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 0}
.hb+.hb{border-top:.5px solid var(--sep)}
.hb .n{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .v{font-family:var(--num);font-weight:600;font-size:14px}
.hb .tr{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:3px;background:var(--accent);width:0;transition:width .9s var(--ease)}
.hb.w .n{color:var(--warn)} .hb.w .tr i{background:repeating-linear-gradient(135deg,var(--c5) 0 4px,color-mix(in srgb,var(--c5) 65%,transparent) 4px 8px)}
/* charts */
.ch{width:100%;height:150px}
.ch text{font-family:var(--ui);font-size:10px;fill:var(--ink-3)}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:8px}
.bars i{flex:1;border-radius:3px 3px 1px 1px;background:var(--surface-3);transform-origin:bottom;animation:grow .8s var(--ease) both}
.bars i.pk{background:var(--accent)}
@keyframes grow{from{transform:scaleY(0)}}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3);margin-top:6px}

/* ============ DOCK ============ */
.dock{position:fixed;z-index:30;left:12px;right:12px;bottom:calc(10px + var(--sab));height:66px;border-radius:24px;padding:6px;display:flex;gap:2px;background:var(--glass);backdrop-filter:saturate(1.8) blur(24px);-webkit-backdrop-filter:saturate(1.8) blur(24px);border:.5px solid var(--line-2);box-shadow:0 12px 36px -12px rgba(0,0,0,.35);transition:transform .38s var(--ease),opacity .3s}
.dock.hide{transform:translateY(130%);opacity:0}
.dock.gone{display:none}
.dock .pill-a{position:absolute;top:6px;bottom:6px;left:6px;border-radius:19px;background:var(--accent-soft);transition:transform .5s var(--spring),width .4s var(--ease)}
.dock a,.dock button{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:19px;color:var(--ink-3);font-size:10.5px;font-weight:600;transition:color .2s}
.dock .on{color:var(--accent-ink)}
.dock svg{transition:transform .35s var(--spring)}
.dock .on svg{transform:scale(1.08)}
.dock a:active svg,.dock button:active svg{transform:scale(.8)}
.dock.jiggle a,.dock.jiggle button{animation:jig .3s ease-in-out infinite alternate}
@keyframes jig{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}

/* ============ SHEETS ============ */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .42s var(--ease);padding-bottom:var(--sab)}
.sheet.show{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line-2);margin:8px auto 2px;flex-shrink:0}
.sheet .sh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 14px 10px}
.sheet .sh b{font-size:16px;font-weight:600;text-align:center}
.sheet .sh .x{justify-self:end;width:30px;height:30px;border-radius:50%;background:var(--surface-3);color:var(--ink-3);display:flex;align-items:center;justify-content:center}
.sheet .sh .l{justify-self:start;color:var(--accent-ink);font-size:16px}
.sheet .sb{overflow-y:auto;padding:0 16px 22px}
.opt{display:flex;justify-content:space-between;align-items:center}
.opt .ck{color:var(--accent-ink);opacity:0}
.opt.on .ck{opacity:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;font-size:16px;font-weight:600;width:100%;transition:transform .2s var(--spring),opacity .2s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.p{background:var(--accent);color:#fff}
.btn.d{background:var(--ink);color:var(--bg)}
.btn.s{background:var(--surface);color:var(--ink)}
.btn.t{background:none;color:var(--accent-ink);height:44px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px;padding:6px 2px}
.apps button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);position:relative}
.apps .ai{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);transition:transform .25s var(--spring)}
.apps button:active .ai{transform:scale(.86)}
.apps .dk{position:absolute;top:-4px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--surface);color:var(--ink-3);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stepper button{width:52px;height:52px;border-radius:50%;background:var(--surface);font-size:24px;display:flex;align-items:center;justify-content:center;transition:transform .2s var(--spring)}
.stepper button:active{transform:scale(.88)}
.stepper .num{font-size:40px;font-weight:600}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld span{font-size:13px;color:var(--ink-3);margin-left:4px}
.inp{height:50px;border-radius:14px;border:0;background:var(--surface);padding:0 16px;font-size:16px;outline:0;width:100%}
.inp:focus{box-shadow:0 0 0 3px var(--accent-soft)}

/* ============ MISC ============ */
.toast{position:fixed;z-index:60;left:50%;top:calc(10px + var(--sat));transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);border-radius:20px;padding:10px 16px;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .45s var(--spring);white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.ptr{height:0;overflow:hidden;visibility:hidden;display:flex;align-items:flex-end;justify-content:center;color:var(--ink-3);transition:height .3s var(--ease)}
.ptr .sp{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line-2);border-top-color:var(--accent);margin-bottom:10px}
.ptr[style*='px'],.ptr.go{visibility:visible}.ptr.go .sp{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sk{position:relative;color:transparent!important}
.sk::after{content:"";position:absolute;inset:2px 0;border-radius:8px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:shim 1s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 24px 20px;gap:10px}
.empty .big{width:96px;height:96px;border-radius:28px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--accent-ink);box-shadow:0 20px 40px -20px rgba(0,0,0,.3)}
.empty h3{margin:10px 0 0;font-size:22px;font-weight:700;letter-spacing:-.015em}
.empty p{margin:0;color:var(--ink-3);font-size:15px;max-width:300px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:13px;margin-bottom:12px}
.banner.w{background:var(--warn-soft);color:var(--warn)}
.banner.g{background:var(--good-soft);color:var(--good)}
.edit-row{display:flex;align-items:center;gap:12px}
