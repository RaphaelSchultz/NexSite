      (function () {
        var path = location.pathname;
        var interior = path === "/ajuda" || path.indexOf("/ajuda/") === 0 || path === "/indicacoes" || path === "/programa-de-afiliados";
        var root = document.documentElement;
        if (interior) {
          root.classList.remove("dark");
          root.setAttribute("data-pref", "light");
          root.setAttribute("data-theme", "light");
          root.style.colorScheme = "light";
          return;
        }
        var pref = "system";
        try { pref = localStorage.getItem("nxl-theme") || "system"; } catch (e) {}
        var media = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
        var theme = pref === "system" ? (media && media.matches ? "dark" : "light") : pref;
        root.setAttribute("data-pref", pref);
        root.setAttribute("data-theme", theme);
        root.classList.toggle("dark", theme === "dark");
        root.style.colorScheme = theme;
      })();
    </script>
